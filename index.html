<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#030d09">
<title>World Frequency</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(0,168,107,.20), transparent 60%),
      radial-gradient(900px 700px at -20% 110%, rgba(46,230,168,.12), transparent 55%),
      #030d09;
    color:#eaf7f0;
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  input { user-select:text; -webkit-user-select:text; }
  .glass {
    background:linear-gradient(160deg, rgba(20,48,36,.62), rgba(8,24,17,.55));
    -webkit-backdrop-filter:blur(16px) saturate(1.35);
    backdrop-filter:blur(16px) saturate(1.35);
    border:1px solid rgba(120,255,205,.16);
    box-shadow:0 10px 30px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.06);
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px;
  }
  .brand { font-size:23px; font-weight:800; letter-spacing:3px; color:#2ee6a8; }
  .brand span { color:#eaf7f0; font-weight:200; }
  .brand small { display:block; font-size:8.5px; letter-spacing:4.5px; color:#8fb8a2; font-weight:600; margin-top:3px; }
  #searchBtn {
    background:rgba(46,230,168,.08); color:#2ee6a8; border:1px solid rgba(46,230,168,.35);
    border-radius:999px; padding:8px 15px; font-size:13px; font-weight:600; cursor:pointer;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  #searchBar { padding:2px 18px 10px; }
  #searchInput {
    width:100%; border-radius:14px; color:#eaf7f0; padding:12px 15px; font-size:15px; outline:none;
    background:rgba(10,30,21,.65); border:1px solid rgba(46,230,168,.3);
  }
  #searchInput::placeholder { color:#648a76; }
  #searchNote { font-size:11px; color:#8fb8a2; margin:7px 2px 0; min-height:14px; }
  #stage { position:relative; flex:0 0 42%; min-height:245px; touch-action:none; }
  #globe { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #markers { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .marker {
    position:absolute; transform:translate(-50%,-50%); pointer-events:auto;
    background:none; border:none; cursor:pointer; text-align:center; padding:6px;
  }
  .marker .dot {
    display:block; width:11px; height:11px; margin:0 auto; border-radius:50%;
    background:#2ee6a8; box-shadow:0 0 10px 2px rgba(46,230,168,.75);
    animation:pulse 2.6s infinite;
  }
  .marker .lbl {
    display:block; margin-top:3px; font-size:9.5px; font-weight:700; letter-spacing:1.2px;
    color:#d9f7e9; text-shadow:0 1px 4px #000, 0 0 6px rgba(0,0,0,.9); white-space:nowrap;
  }
  .marker.active .dot { background:#fff; box-shadow:0 0 14px 4px rgba(46,230,168,.95); }
  @keyframes pulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.35);} }
  #band {
    position:absolute; left:0; right:0; bottom:2px; height:26px;
    border-top:1px solid rgba(46,230,168,.18);
    background:linear-gradient(180deg, rgba(3,13,9,0), rgba(3,13,9,.75) 40%);
  }
  #bandTicks { position:absolute; inset:0; }
  .tick {
    position:absolute; top:5px; transform:translateX(-50%); font-size:8px; letter-spacing:.6px;
    color:#648a76; white-space:nowrap; text-align:center; cursor:pointer; background:none; border:none;
  }
  .tick b { display:block; font-size:9.5px; color:#8fb8a2; font-weight:700; }
  .tick.on b { color:#2ee6a8; }
  #needle {
    position:absolute; left:4%; top:0; bottom:0; width:2px; background:#2ee6a8;
    box-shadow:0 0 8px rgba(46,230,168,.9); transition:left .7s cubic-bezier(.6,0,.2,1);
  }
  #needle:after {
    content:""; position:absolute; top:-1px; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top:6px solid #2ee6a8;
  }
  main { flex:1; overflow-y:auto; padding:12px 16px 10px; -webkit-overflow-scrolling:touch; }
  main > div { animation:viewin .38s cubic-bezier(.3,.9,.3,1); }
  @keyframes viewin { from { opacity:0; transform:translateY(9px);} to { opacity:1; transform:none;} }
  .panelTitle { font-size:11px; letter-spacing:2.6px; color:#8fb8a2; text-transform:uppercase; margin:4px 0 12px; font-weight:600; }
  .region { font-size:10.5px; letter-spacing:3px; color:#2ee6a8; font-weight:800; margin:18px 0 9px; text-transform:uppercase; }
  .cityCard {
    display:flex; justify-content:space-between; align-items:center; width:100%;
    border-radius:18px; padding:15px 17px; margin-bottom:9px; color:#eaf7f0; cursor:pointer; text-align:left;
  }
  .cityCard .nm { font-size:16.5px; font-weight:700; letter-spacing:.2px; }
  .cityCard .ct { font-size:11.5px; color:#8fb8a2; margin-top:3px; }
  .cityCard .fq { font-size:14px; color:#2ee6a8; font-weight:800; letter-spacing:1px; }
  .cityCard .fq small { display:block; font-size:8.5px; color:#648a76; letter-spacing:1.5px; font-weight:600; text-align:right; margin-top:2px; }
  #backBtn, #backBtn2 { background:none; border:none; color:#2ee6a8; font-size:14px; font-weight:700; cursor:pointer; padding:4px 0 10px; }
  #cityHead .nm { font-size:25px; font-weight:800; letter-spacing:.3px; }
  #cityHead .ct { font-size:12.5px; color:#8fb8a2; margin-top:3px; }
  #chips { display:flex; gap:7px; flex-wrap:wrap; margin:13px 0; }
  .chip {
    border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer;
    background:rgba(12,34,24,.55); border:1px solid rgba(46,230,168,.25); color:#b7d9c7;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .chip.on { background:#2ee6a8; color:#032117; border-color:#2ee6a8; }
  .stRow {
    display:flex; align-items:center; gap:12px; width:100%;
    border-radius:18px; padding:12px 13px; margin-bottom:9px; color:#eaf7f0; cursor:pointer; text-align:left;
  }
  .stRow.playing { border-color:rgba(46,230,168,.75); background:linear-gradient(160deg, rgba(46,230,168,.20), rgba(10,32,22,.55)); }
  .tile {
    flex:0 0 46px; width:46px; height:46px; border-radius:14px; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; letter-spacing:.5px; color:#eafff5;
    background:linear-gradient(140deg, #0f5132, #00a86b);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 4px 12px rgba(0,0,0,.35);
  }
  .tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#eaf7f0; }
  .tile.g-Dance { background:linear-gradient(140deg, #5b2a86, #b44ce0); }
  .tile.g-Classical { background:linear-gradient(140deg, #6e5210, #d9a441); }
  .tile.g-Jazz { background:linear-gradient(140deg, #7a2b3a, #e0654f); }
  .tile.g-World { background:linear-gradient(140deg, #0b4f5c, #19b8a6); }
  .tile.g-Modern { background:linear-gradient(140deg, #0f5132, #00a86b); }
  .tile.g-Reggae { background:linear-gradient(140deg, #6d1a1a, #c9920e); }
  .tile.g-HipHop { background:linear-gradient(140deg, #1c2340, #7b5cff); }
  .stRow .info { flex:1; min-width:0; }
  .stRow .nm { font-size:15.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stRow .mt { font-size:11px; color:#8fb8a2; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag { font-size:9px; font-weight:800; letter-spacing:1.2px; color:#2ee6a8; border:1px solid rgba(46,230,168,.4); border-radius:6px; padding:3px 6px; text-transform:uppercase; }
  .heart { background:none; border:none; font-size:19px; color:#41604f; cursor:pointer; padding:4px 2px; line-height:1; }
  .heart.on { color:#2ee6a8; }
  #luckyBtn {
    width:100%; margin:2px 0 8px; padding:14px; border-radius:18px; cursor:pointer;
    background:linear-gradient(90deg, rgba(0,168,107,.35), rgba(46,230,168,.28));
    border:1px solid rgba(46,230,168,.45); color:#eaf7f0; font-size:14.5px; font-weight:800; letter-spacing:.4px;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:0 8px 22px rgba(0,0,0,.3);
  }
  #playerWrap { padding:0 12px 34px; padding-bottom:max(34px, calc(12px + env(safe-area-inset-bottom))); }
  footer { border-radius:26px; padding:14px 16px; }
  #prow { display:flex; align-items:center; gap:13px; }
  #playBtn {
    flex:0 0 54px; width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:#2ee6a8; color:#032117; font-size:21px; font-weight:900;
    box-shadow:0 0 22px rgba(46,230,168,.5);
  }
  #np { flex:1; min-width:0; }
  #npName { font-size:16px; font-weight:800; overflow-wrap:break-word; }
  #npMeta { font-size:11.5px; color:#8fb8a2; margin-top:1px; overflow-wrap:break-word; }
  #npTrack { font-size:12.5px; color:#2ee6a8; margin-top:3px; min-height:16px; font-weight:600; overflow-wrap:break-word; }
  #eq { display:flex; gap:3px; align-items:flex-end; height:12px; margin-top:5px; }
  #eq i { width:4px; height:4px; background:#2ee6a8; border-radius:2px; opacity:.35; }
  #eq.live i { opacity:1; animation:eqb .9s ease-in-out infinite; }
  #eq.live i:nth-child(2){ animation-delay:.15s; } #eq.live i:nth-child(3){ animation-delay:.3s; }
  #eq.live i:nth-child(4){ animation-delay:.45s; } #eq.live i:nth-child(5){ animation-delay:.6s; }
  @keyframes eqb { 0%,100%{ height:4px; } 50%{ height:12px; } }
  #pctl { display:flex; align-items:center; gap:9px; }
  #vol { width:70px; accent-color:#2ee6a8; }
  #status { font-size:11.5px; color:#8fd8b8; margin-top:9px; min-height:15px; }
  #status.err { color:#ff9d8a; }
</style>
</head>
<body>
<header>
  <div class="brand">WORLD <span>FREQUENCY</span><small>GLOBAL RADIO</small></div>
  <button id="searchBtn">Search</button>
</header>
<div id="searchBar" hidden>
  <input id="searchInput" type="search" placeholder="Search any station or city in the world" autocomplete="off">
  <div id="searchNote">Searches a live worldwide directory of stations.</div>
</div>
<section id="stage">
  <canvas id="globe"></canvas>
  <div id="markers"></div>
  <div id="band"><div id="bandTicks"></div><div id="needle"></div></div>
</section>
<main id="panel">
  <div id="homeView">
    <button id="luckyBtn">Take me somewhere</button>
    <div class="panelTitle">Tap a city on the globe, or pick one</div>
    <div id="favBlock"></div>
    <div id="cityList"></div>
  </div>
  <div id="cityView" hidden>
    <button id="backBtn">&#8592; All cities</button>
    <div id="cityHead"></div>
    <div id="chips"></div>
    <div id="stationList"></div>
  </div>
  <div id="searchView" hidden>
    <button id="backBtn2">&#8592; Back</button>
    <div class="panelTitle">Search results</div>
    <div id="searchResults"></div>
  </div>
</main>
<div id="playerWrap">
  <footer class="glass">
    <div id="prow">
      <button id="playBtn">&#9654;</button>
      <div id="np">
        <div id="npName">Nothing playing</div>
        <div id="npMeta">Pick a city, pick a station</div>
        <div id="npTrack"></div>
        <div id="eq"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div id="pctl">
        <input type="range" id="vol" min="0" max="1" step="0.05" value="0.9">
      </div>
    </div>
    <div id="status"></div>
  </footer>
</div>
<audio id="audio" preload="none" referrerpolicy="no-referrer"></audio>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

const stage = document.getElementById('stage');

const ctx = canvas.getContext('2d');
const markersEl = document.getElementById('markers');
let W = 0, H = 0, DPR = 1;
function fitCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth; H = stage.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', fitCanvas);

let rot = 15, tilt = 16, zoom = 1;
let targetRot = null, targetTilt = null;
let dragging = false, lastInteract = 0, vel = 0;
const pointers = new Map(); let pinchD = 0;

function proj(lat, lon){
  const la = lat * Math.PI / 180, lo = (lon + rot) * Math.PI / 180, ti = tilt * Math.PI / 180;
  const cx = Math.cos(la) * Math.sin(lo), sy = Math.sin(la), cz = Math.cos(la) * Math.cos(lo);
  return { x: cx, y: sy * Math.cos(ti) - cz * Math.sin(ti), z: sy * Math.sin(ti) + cz * Math.cos(ti) };
}

function drawGlobe(){
  if (!W) fitCanvas();
  const R = Math.min(W, H) * 0.44 * zoom, cxp = W / 2, cyp = H / 2;
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createRadialGradient(cxp, cyp, R * 0.1, cxp, cyp, R);
  g.addColorStop(0, '#0a2e20'); g.addColorStop(0.75, '#062117'); g.addColorStop(1, '#04150e');
  ctx.beginPath(); ctx.arc(cxp, cyp, R, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.save();
  ctx.shadowColor = 'rgba(46,230,168,.55)'; ctx.shadowBlur = 22;
  ctx.beginPath(); ctx.arc(cxp, cyp, R, 0, 7); ctx.strokeStyle = 'rgba(46,230,168,.5)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();
  const buckets = [[], [], [], []];
  for (let i = 0; i < DOTS.length; i++){
    const p = proj(DOTS[i][0], DOTS[i][1]);
    if (p.z > 0) buckets[Math.min(3, (p.z * 4) | 0)].push(cxp + p.x * R, cyp - p.y * R);
  }
  for (let b = 0; b < 4; b++){
    ctx.fillStyle = 'rgba(46,230,168,' + (0.16 + b * 0.24) + ')';
    const arr = buckets[b], s = b >= 2 ? 2 : 1.5;
    for (let j = 0; j < arr.length; j += 2) ctx.fillRect(arr[j], arr[j + 1], s, s);
  }
  CITIES.forEach((c, i) => {
    const p = proj(c.lat, c.lon), b = markerBtns[i];
    if (p.z > 0.1){
      b.style.display = 'block';
      b.style.left = (cxp + p.x * R) + 'px';
      b.style.top = (cyp - p.y * R) + 'px';
      b.style.opacity = Math.min(1, (p.z - 0.1) * 3);
    } else b.style.display = 'none';
  });
}
function tick(){
  const now = performance.now();
  if (targetRot !== null){
    let d = ((targetRot - rot + 540) % 360) - 180;
    rot += d * 0.09; tilt += (targetTilt - tilt) * 0.09;
    if (Math.abs(d) < 0.4 && Math.abs(targetTilt - tilt) < 0.4){ rot = targetRot; tilt = targetTilt; targetRot = null; }
  } else if (!dragging){
    if (Math.abs(vel) > 0.005){ rot += vel; vel *= 0.94; }
    else if (now - lastInteract > 4000 && view === 'home') rot += 0.025;
  }

  requestAnimationFrame(tick);
}
stage.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  stage.setPointerCapture(e.pointerId);
  dragging = true; vel = 0; targetRot = null; lastInteract = performance.now();
  if (pointers.size === 2){ const p = [...pointers.values()]; pinchD = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]); }
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  lastInteract = performance.now();
  if (pointers.size === 1){
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
    rot += dx * 0.3; vel = dx * 0.3;
    tilt = Math.max(-45, Math.min(55, tilt + dy * 0.2));
  } else if (pointers.size === 2){
    const p = [...pointers.values()], d = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]);
    if (pinchD) zoom = Math.max(0.7, Math.min(1.9, zoom * d / pinchD));
    pinchD = d;
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (!pointers.size){ dragging = false; lastInteract = performance.now(); }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.7, Math.min(1.9, zoom * (e.deltaY < 0 ? 1.09 : 0.92)));
  lastInteract = performance.now();
}, { passive:false });
document.addEventListener('gesturestart', e => e.preventDefault());

      const b = document.createElement('button');

      b.innerHTML = '<span><span class="nm">' + c.name + '</span><span class="ct"><br>' + c.country + ' · ' + c.stations.length + (c.stations.length > 1 ? ' stations' : ' station') + '</span></span><span class="fq">' + c.freq + '<small>FM · WF</small></span>';
      b.addEventListener('click', () => selectCity(i, true));
      list.appendChild(b);
    });
  });
  renderFavs();
}
function renderFavs(){
  const fb = document.getElementById('favBlock');
  fb.innerHTML = '';
  if (!favs.length) return;
  const h = document.createElement('div'); h.className = 'region'; h.textContent = 'Your favorites';
  fb.appendChild(h);
  favs.forEach(f => fb.appendChild(stationRow(f)));
}
function renderCity(){
  const c = CITIES[currentCity];
  document.getElementById('cityHead').innerHTML =
    '<div class="nm">' + c.name + '</div><div class="ct">' + c.country + ' · ' + c.freq + ' on the World Frequency dial</div>';
  const genres = ['All', ...new Set(c.stations.map(s => s.genre))];
  const chips = document.getElementById('chips'); chips.innerHTML = '';
  genres.forEach(g => {
    const ch = document.createElement('button');
    ch.className = 'chip' + (genreFilter === g ? ' on' : ''); ch.type = 'button'; ch.textContent = g;
    ch.addEventListener('click', () => { genreFilter = g; renderCity(); });
    chips.appendChild(ch);
  });
  const list = document.getElementById('stationList'); list.innerHTML = '';
  c.stations.filter(s => genreFilter === 'All' || s.genre === genreFilter)
    .forEach(s => list.appendChild(stationRow(s)));
  markerBtns.forEach((b, i) => b.classList.toggle('active', i === currentCity));
}
function renderPanelBits(){
  if (view === 'home') renderHome();
  else if (view === 'city') renderCity();
  document.querySelectorAll('.stRow').forEach(r =>
    r.classList.toggle('playing', !!(current && current.key === r.dataset.key)));
}
function selectCity(i, rotateTo){
  currentCity = i; genreFilter = 'All';
  show('city'); renderCity(); setNeedle(i);
  if (rotateTo){
    targetRot = -CITIES[i].lon;
    targetTilt = Math.max(-45, Math.min(55, CITIES[i].lat));
  }
}
document.getElementById('backBtn').addEventListener('click', () => { show('home'); renderHome(); });
document.getElementById('backBtn2').addEventListener('click', () => {
  if (currentCity >= 0){ show('city'); renderCity(); } else { show('home'); renderHome(); }
});
document.getElementById('luckyBtn').addEventListener('click', () => {
  const st = ALL_STATIONS[(Math.random() * ALL_STATIONS.length) | 0];
  const ci = CITIES.findIndex(c => c.name === st.city);
  selectCity(ci, true);
  playStation(st);
});

/* ---------------- player ---------------- */
const audio = document.getElementById('audio');
const statusEl = document.getElementById('status');
const npName = document.getElementById('npName');
const npMeta = document.getElementById('npMeta');
const npTrack = document.getElementById('npTrack');
const eq = document.getElementById('eq');
const playBtn = document.getElementById('playBtn');
let current = null, hls = null, playSeq = 0, urlIdx = 0, watchdog = null, urlRetries = 0, slowTimer = null, deadStream = false;
function setStatus(msg, isErr){
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('err', !!isErr);
}
function setPlayingUI(on){
  playBtn.innerHTML = on ? '&#10073;&#10073;' : '&#9654;';
  eq.classList.toggle('live', on);
  document.querySelectorAll('.stRow').forEach(r =>
    r.classList.toggle('playing', !!(current && current.key === r.dataset.key)));
}
function failover(seq){
  if (seq !== playSeq || !current) return;
  clearTimeout(watchdog); clearTimeout(slowTimer);
  if (urlRetries < 1){
    urlRetries++;
    setStatus('That connection stumbled. Retrying ' + current.name + '…');
    setTimeout(() => { if (seq === playSeq && current) loadUrl(seq); }, 1200);
    return;
  }
  urlIdx++; urlRetries = 0;
  if (urlIdx < current.urls.length){
    setStatus('That stream did not answer. Trying another route to ' + current.name + '…');
    loadUrl(seq);
  } else {
    deadStream = true;
    setPlayingUI(false);
    setStatus('Could not reach ' + current.name + ' just now. It may be down, or blocked on this network. Try another station, or search ' + (current.city || 'the directory') + ' for alternates.', true);
  }
}
function loadUrl(seq){
  const url = current.urls[urlIdx];
  clearTimeout(watchdog); clearTimeout(slowTimer);
  watchdog = setTimeout(() => failover(seq), 15000);
  slowTimer = setTimeout(() => {
    if (seq === playSeq && current) setStatus('Still tuning… ' + current.name + ' is far away, and a first connect can take a few seconds.');
  }, 6000);
  if (hls){ hls.destroy(); hls = null; }
  if (current.hls && url.indexOf('.m3u8') >= 0){
    if (window.Hls && Hls.isSupported()){
      hls = new Hls({ maxBufferLength: 30 });
      hls.loadSource(url); hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { if (seq === playSeq) audio.play().catch(() => failover(seq)); });
      hls.on(Hls.Events.ERROR, (e, d) => { if (seq === playSeq && d && d.fatal) failover(seq); });
      return;
    }
    if (audio.canPlayType('application/vnd.apple.mpegurl')){ audio.src = url; audio.load(); }
    else { failover(seq); return; }
  } else {
    audio.src = url;
    audio.load();
  }
  const p = audio.play();
  if (p && p.catch) p.catch(() => failover(seq));
}
function playStation(st){
  current = st; urlIdx = 0; urlRetries = 0; deadStream = false;
  const seq = ++playSeq;
  stopNp();
  npTrack.textContent = '';
  npName.textContent = st.name;
  npMeta.textContent = (st.city || '') + (st.genre ? ' · ' + st.genre : '') + ' · Live radio';
  setStatus('Tuning in to ' + st.name + '…');
  setPlayingUI(false);
  loadUrl(seq);
  updateMediaSession(null);
}
function togglePlay(){
  if (!current){ setStatus('Pick a city, then a station, and it plays.'); return; }
  if (deadStream){ playStation(current); return; }
  if (audio.paused){
    const p = audio.play();
    if (p && p.catch) p.catch(() => setStatus('Could not resume. Tap the station again.', true));
  } else audio.pause();
}
playBtn.addEventListener('click', togglePlay);
audio.addEventListener('playing', () => {
  clearTimeout(watchdog); clearTimeout(slowTimer);
  deadStream = false; urlRetries = 0;
  setPlayingUI(true);
  if (current){ setStatus('Live · ' + current.name + (current.city ? ' · ' + current.city : '')); startNp(current); }
});
audio.addEventListener('pause', () => { setPlayingUI(false); stopNp(); });
audio.addEventListener('error', () => { if (current && audio.src) failover(playSeq); });
audio.addEventListener('waiting', () => { if (current) setStatus('Buffering ' + current.name + '…'); });
document.getElementById('vol').addEventListener('input', e => { audio.volume = parseFloat(e.target.value); });
audio.volume = 0.9;
function updateMediaSession(trackText){
  if (!('mediaSession' in navigator) || !current) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: trackText || current.name,
      artist: (trackText ? current.name + ' · ' : '') + (current.city || '') + ' · World Frequency',
      album: 'World Frequency'
    });
  } catch(e){}
}
if ('mediaSession' in navigator){
  try {
    navigator.mediaSession.setActionHandler('play', () => { if (current) audio.play(); });
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => cycleStation(1));
    navigator.mediaSession.setActionHandler('previoustrack', () => cycleStation(-1));
  } catch(e){}
}
function cycleStation(dir){
  if (!current) return;
  const ci = CITIES.findIndex(c => c.name === current.city);
  const list = ci >= 0 ? CITIES[ci].stations : [current];
  let i = list.findIndex(s => s.key === current.key);
  i = (i + dir + list.length) % list.length;
  playStation(list[i]);
}

/* ---------------- track info ---------------- */
let npTimer = null, npStation = null;
function fetchJson(url, ms){
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), ms || 6000);
  return fetch(url, { signal: ctl.signal }).then(r => { clearTimeout(to); if (!r.ok) throw new Error('bad'); return r.json(); });
}
let ntsCache = null, ntsCacheAt = 0, somaCache = null, somaCacheAt = 0;
function npNts(which){
  if (!ntsCache || Date.now() - ntsCacheAt > 25000){
    ntsCache = fetchJson('https://www.nts.live/api/v2/live'); ntsCacheAt = Date.now();
  }
  return ntsCache.then(data => {
    const res = (data && data.results) || [];
    const ch = res.find(r => String(r.channel_name) === which);
    if (!ch || !ch.now) return null;
    const n = ch.now;
    if (n.broadcast_title) return n.broadcast_title;
    if (n.embeds && n.embeds.details && n.embeds.details.name) return n.embeds.details.name;
    return null;
  }).catch(() => null);
}
function npSoma(id){
  if (!somaCache || Date.now() - somaCacheAt > 25000){
    somaCache = fetchJson('https://somafm.com/channels.json'); somaCacheAt = Date.now();
  }
  return somaCache.then(data => {
    const ch = ((data && data.channels) || []).find(c => c.id === id);
    return ch && ch.lastPlaying ? ch.lastPlaying : null;
  }).catch(() => null);
}
function npIcecast(st){
  const url = st.urls[0];
  if (!url || url.indexOf('.m3u8') >= 0) return Promise.resolve(null);
  let u; try { u = new URL(url); } catch(e){ return Promise.resolve(null); }
  return fetchJson(u.origin + '/status-json.xsl', 4000).then(data => {
    const src = data && data.icestats && data.icestats.source;
    if (!src) return null;
    const list = Array.isArray(src) ? src : [src];
    const mount = u.pathname.split('/').pop();
    const hit = list.find(s => (s.listenurl || '').indexOf(mount) >= 0) || list[0];
    return hit && hit.title ? String(hit.title) : null;
  }).catch(() => null);
}
function npFetch(st){
  if (st.np === 'nts1') return npNts('1');
  if (st.np === 'nts2') return npNts('2');
  if (st.np && st.np.indexOf('soma:') === 0) return npSoma(st.np.slice(5));
  if (st._npDead) return Promise.resolve(null);
  return npIcecast(st).then(t => { if (!t){ st._npMiss = (st._npMiss || 0) + 1; if (st._npMiss >= 2) st._npDead = true; } return t; });
}
function startNp(st){
  stopNp();
  npStation = st;
  const run = () => {
    if (npStation !== st || !current || current.key !== st.key) return;
    npFetch(st).then(text => {
      if (npStation !== st || !current || current.key !== st.key) return;
      if (text){ npTrack.textContent = '♪ ' + text; updateMediaSession(text); }
    });
  };
  run();
  npTimer = setInterval(run, 30000);
}
function stopNp(){ if (npTimer) clearInterval(npTimer); npTimer = null; npStation = null; }

/* ---------------- search ---------------- */
const searchBtn = document.getElementById('searchBtn');
const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
const searchNote = document.getElementById('searchNote');
const searchResults = document.getElementById('searchResults');
searchBtn.addEventListener('click', () => {
  const open = searchBar.hidden;
  searchBar.hidden = !open;
  searchBtn.textContent = open ? 'Close' : 'Search';
  if (open) searchInput.focus();
  else show(currentCity >= 0 ? 'city' : 'home');
});
let searchSeq = 0;
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  const seq = ++searchSeq;
  if (q.length < 3){ searchNote.textContent = 'Searches a live worldwide directory of stations.'; return; }
  searchNote.textContent = 'Searching the world…';
  const hosts = ['https://de1.api.radio-browser.info', 'https://de2.api.radio-browser.info', 'https://nl1.api.radio-browser.info'];
  const query = '/json/stations/search?name=' + encodeURIComponent(q) + '&hidebroken=true&order=votes&reverse=true&limit=30';
  const attempt = hi => fetch(hosts[hi] + query).then(r => r.json()).catch(() => { if (hi + 1 < hosts.length) return attempt(hi + 1); throw new Error('directory unreachable'); });
  attempt(0).then(rows => {
    if (seq !== searchSeq) return;
    searchResults.innerHTML = '';
    if (!rows.length){ searchNote.textContent = 'No stations matched that. Try a station name, a city, or a style like "jazz".'; show('search'); return; }
    searchNote.textContent = rows.length + ' stations found. Tap one to play it.';
    rows.forEach(rw => {
      const tag = (rw.tags || '').split(',')[0];
      const st = {
        name: rw.name, genre: tag ? tag[0].toUpperCase() + tag.slice(1) : 'Radio',
        city: rw.state || rw.country || 'Worldwide',
        urls: [rw.url_resolved || rw.url], hls: (rw.url_resolved || '').indexOf('.m3u8') >= 0,
        favicon: rw.favicon || null,
        key: 'search|' + (rw.url_resolved || rw.url)
      };
      searchResults.appendChild(stationRow(st));
    });
    show('search');
  }).catch(() => { if (seq === searchSeq) searchNote.textContent = 'The station directory did not answer. Check your connection and try again.'; });
});

fitCanvas();
renderHome();
requestAnimationFrame(tick);
